refresh_my_incharge_tokens:
  name: Refresh My InCharge tokens
  description: Manually refresh the My InCharge OAuth tokens for testing.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to refresh all configured My InCharge accounts.
      required: false
      selector:
        text: {}

download_my_incharge_report:
  name: Download My InCharge report
  description: Download a My InCharge charging-history report to /config/www/vattenfall_incharge/reports.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to download for all configured My InCharge accounts.
      required: false
      selector:
        text: {}
    format:
      name: Format
      description: Report file format.
      required: false
      default: csv
      selector:
        select:
          options:
            - csv
            - xlsx
    period:
      name: Period
      description: Report period.
      required: false
      default: this_month
      selector:
        select:
          options:
            - this_week
            - last_7_days
            - this_month
            - last_month
            - last_30_days
            - last_12_months
            - this_year
            - last_year
            - custom
    start_date:
      name: Start date
      description: Start date for custom reports.
      required: false
      selector:
        date: {}
    end_date:
      name: End date
      description: End date for custom reports. Leave empty to export one day.
      required: false
      selector:
        date: {}
    filename:
      name: Filename
      description: Optional filename. The selected extension is added automatically when omitted.
      required: false
      selector:
        text: {}
