name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("custom_components/vattenfall_incharge/manifest.json").read_text())["version"])')"

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($VERSION) does not match manifest version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Package custom component
        shell: bash
        run: |
          cd custom_components
          zip -r ../vattenfall_incharge.zip vattenfall_incharge \
            -x "*/__pycache__/*" \
            -x "*.pyc"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" vattenfall_incharge.zip --clobber
            gh release edit "$TAG" \
              --title "$TAG" \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              vattenfall_incharge.zip \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
